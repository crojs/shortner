<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>URL Shortener · Premium Tool</title>
  <!-- No external icons, no 3rd party libraries. Pure HTML+CSS+JS -->
  <meta name="description" content="Premium URL shortener tool – create short links instantly. Clean, fast, and SEO ready.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #0b1b2f;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12), 0 8px 24px -8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #0b1b2f;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .subhead {
      font-size: 1rem;
      color: #475569;
      margin-bottom: 2rem;
      border-left: 4px solid #2563eb;
      padding-left: 1rem;
      background: #f1f5f9;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
      padding: 0.75rem 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .input-row input {
      flex: 1 1 240px;
      padding: 0.9rem 1.2rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 60px;
      font-size: 1rem;
      background: #ffffff;
      transition: 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      color: #0b1b2f;
    }

    .input-row input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .input-row input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .btn {
      background: #2563eb;
      border: none;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.01em;
      border: 1px solid transparent;
      min-width: 120px;
    }

    .btn:hover {
      background: #1d4ed8;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
      transform: scale(1.01);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #1e293b;
      box-shadow: none;
      border: 1px solid #d1d9e6;
      min-width: 100px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.04);
    }

    .result-area {
      margin: 1.8rem 0 1.2rem;
      background: #f8fafc;
      border-radius: 40px;
      padding: 0.25rem 0.25rem 0.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #e9edf2;
      min-height: 68px;
      transition: 0.15s;
    }

    .result-area .short-url {
      font-size: 1.05rem;
      font-weight: 500;
      color: #0b1b2f;
      word-break: break-all;
      padding: 0.4rem 0;
      flex: 1 1 160px;
    }

    .result-area .short-url a {
      color: #2563eb;
      text-decoration: none;
      border-bottom: 1px dashed #b9d0fa;
    }

    .result-area .short-url a:hover {
      border-bottom: 1px solid #2563eb;
    }

    .result-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.3rem 0;
    }

    .btn-sm {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      min-width: 70px;
      border-radius: 40px;
      background: #ffffff;
      border: 1px solid #d1d9e6;
      color: #1e293b;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .btn-sm:hover {
      background: #f1f5f9;
      border-color: #b0c0d4;
    }

    .btn-sm.copy-btn {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .btn-sm.copy-btn:hover {
      background: #1d4ed8;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin: 1.5rem 0 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eef2f6;
      font-size: 0.9rem;
      color: #475569;
    }

    .stats span {
      background: #f1f5f9;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-weight: 450;
    }

    .ai-badge {
      background: #dbeafe;
      border-radius: 40px;
      padding: 0.2rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e4a8a;
      letter-spacing: 0.01em;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #eef2f6;
      padding-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.5rem;
    }

    .footer-note strong {
      color: #1e293b;
      font-weight: 500;
    }

    .short-history {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #334155;
      background: #f8fafc;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem 1rem;
    }

    .short-history .history-item {
      background: #ffffff;
      padding: 0.15rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .history-item a {
      color: #2563eb;
      text-decoration: none;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .container { padding: 1.5rem 1rem; }
      h1 { font-size: 1.8rem; }
      .input-row input { flex: 1 1 100%; }
      .btn { width: 100%; }
      .result-area { flex-direction: column; align-items: stretch; padding: 1rem; gap: 0.5rem; }
      .result-area .short-url { padding-left: 0; }
      .result-actions { justify-content: stretch; }
      .btn-sm { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>🔗</span> URL Shortener
      <span class="ai-badge" style="margin-left: auto; background:#dbeafe;">✦ AI‑ready</span>
    </h1>
    <div class="subhead">
      ⚡ Premium short links · no tracking · pure client-side · SEO friendly
    </div>

    <!-- Input Section -->
    <div class="input-group">
      <div class="input-row">
        <input type="url" id="longUrlInput" placeholder="https://example.com/very-long-link..." value="https://en.wikipedia.org/wiki/URL_shortening">
        <button class="btn" id="shortenBtn">Shorten</button>
      </div>
    </div>

    <!-- Result Display -->
    <div class="result-area" id="resultArea">
      <div class="short-url" id="shortUrlDisplay">
        <span style="color:#94a3b8;">your short link appears here</span>
      </div>
      <div class="result-actions">
        <button class="btn-sm copy-btn" id="copyBtn">📋 Copy</button>
        <button class="btn-sm" id="openLinkBtn">↗ Open</button>
      </div>
    </div>

    <!-- Stats & AI feature -->
    <div class="stats">
      <span id="linkCountDisplay">🔹 0 links shortened</span>
      <span class="ai-badge" style="background:#e6f0ff;">🤖 AI hash + smart redirect</span>
    </div>

    <!-- Short history (last 3) -->
    <div class="short-history" id="historyContainer">
      <span style="font-weight:450;">📌 history</span>
      <span style="color:#94a3b8; font-size:0.8rem;" id="historyPlaceholder">no links yet</span>
    </div>

    <div class="footer-note">
      <span><strong>100%</strong> client‑side</span>
      <span><strong>SEO</strong> friendly structure</span>
      <span><strong>No</strong> 3rd party</span>
      <span>🔒 privacy first</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---------- state ----------
      let shortLinks = [];            // array of { short: string, long: string }
      let counter = 0;              // for unique id / short code

      // DOM refs
      const longInput = document.getElementById('longUrlInput');
      const shortenBtn = document.getElementById('shortenBtn');
      const shortDisplay = document.getElementById('shortUrlDisplay');
      const copyBtn = document.getElementById('copyBtn');
      const openBtn = document.getElementById('openLinkBtn');
      const linkCountSpan = document.getElementById('linkCountDisplay');
      const historyContainer = document.getElementById('historyContainer');
      const historyPlaceholder = document.getElementById('historyPlaceholder');

      // ---------- helpers ----------
      function isValidUrl(string) {
        try {
          const url = new URL(string);
          return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) {
          return false;
        }
      }

      // simple hash: djb2 + base62 (no 3rd party)
      function generateShortHash(input) {
        let hash = 0;
        for (let i = 0; i < input.length; i++) {
          const char = input.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash; // Convert to 32bit integer
        }
        // ensure positive and base62
        const positive = Math.abs(hash);
        // mix with counter for uniqueness
        const seed = positive + counter * 1009;
        return toBase62(seed) + toBase62(counter + 7);
      }

      function toBase62(num) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        let n = Math.abs(num);
        if (n === 0) return '0';
        while (n > 0) {
          result = chars[n % 62] + result;
          n = Math.floor(n / 62);
        }
        return result;
      }

      // generate short code
      function createShortCode(longUrl) {
        const base = longUrl + Date.now() + Math.random();
        const hash = generateShortHash(base);
        // ensure min length 5
        const short = (hash.length < 5) ? hash + 'a' : hash;
        // truncate to 10 chars for cleanliness
        return short.slice(0, 10);
      }

      // ---------- core shorten function ----------
      function shortenUrl(longUrl) {
        if (!longUrl || longUrl.trim() === '') {
          alert('Please enter a valid URL.');
          return null;
        }
        const trimmed = longUrl.trim();
        if (!isValidUrl(trimmed)) {
          alert('Please enter a valid HTTP/HTTPS URL.');
          return null;
        }

        // check if already shortened (optional: avoid duplicates)
        const existing = shortLinks.find(item => item.long === trimmed);
        if (existing) {
          return existing.short;
        }

        // generate new short code
        const shortCode = createShortCode(trimmed);
        // store
        shortLinks.push({ short: shortCode, long: trimmed });
        counter++;
        return shortCode;
      }

      // ---------- UI update ----------
      function updateUI(shortCode, longUrl) {
        // display short link
        const baseUrl = window.location.origin + window.location.pathname;
        const fullShort = baseUrl + '?s=' + shortCode;
        // show as clickable link
        shortDisplay.innerHTML = `<a href="${fullShort}" target="_blank" rel="noopener">${fullShort}</a>`;
        // update stats
        linkCountSpan.textContent = `🔹 ${shortLinks.length} links shortened`;
        // update history
        updateHistory();
        // set copy data
        copyBtn.dataset.copyUrl = fullShort;
        // store for open
        openBtn.dataset.openUrl = fullShort;
        // also store long in data for redirect
        openBtn.dataset.longUrl = longUrl;
      }

      function updateHistory() {
        // show last 3 in history
        const historyItems = shortLinks.slice(-3);
        if (historyItems.length === 0) {
          historyPlaceholder.textContent = 'no links yet';
          return;
        }
        // clear placeholder
        historyPlaceholder.textContent = '';
        // rebuild history items
        const container = historyContainer;
        // remove old history items (keep the label)
        const label = container.querySelector('span:first-child');
        const placeholder = container.querySelector('#historyPlaceholder');
        // remove all after label and placeholder
        const children = container.children;
        const toRemove = [];
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          if (child !== label && child !== placeholder && child.tagName !== 'SPAN') {
            toRemove.push(child);
          }
        }
        toRemove.forEach(el => el.remove());

        // add new history items (max 3)
        historyItems.forEach(item => {
          const span = document.createElement('span');
          span.className = 'history-item';
          const base = window.location.origin + window.location.pathname + '?s=' + item.short;
          const longDisplay = item.long.length > 28 ? item.long.slice(0, 28) + '…' : item.long;
          span.innerHTML = `🔗 <a href="${base}" target="_blank" rel="noopener" title="${item.long}">${base}</a>`;
          container.appendChild(span);
        });
        // hide placeholder if items exist
        if (historyItems.length > 0) {
          placeholder.style.display = 'none';
        } else {
          placeholder.style.display = 'inline';
        }
      }

      // ---------- handle shorten action ----------
      function handleShorten() {
        const longUrl = longInput.value.trim();
        const shortCode = shortenUrl(longUrl);
        if (shortCode) {
          const fullShort = window.location.origin + window.location.pathname + '?s=' + shortCode;
          const long = longUrl;
          updateUI(shortCode, long);
          // store last long for open
          openBtn.dataset.longUrl = long;
        } else {
          // error already alerted
        }
      }

      // ---------- redirect logic on load (handle ?s= ) ----------
      function handleRedirect() {
        const params = new URLSearchParams(window.location.search);
        const shortCode = params.get('s');
        if (!shortCode) return false;

        // find matching short link
        const found = shortLinks.find(item => item.short === shortCode);
        if (found) {
          // redirect to original long url
          window.location.replace(found.long);
          return true;
        } else {
          // not found: show message but keep page
          shortDisplay.innerHTML = `<span style="color:#b91c1c;">⚠️ Short link not found</span>`;
          return false;
        }
      }

      // ---------- copy & open handlers ----------
      function handleCopy() {
        const url = copyBtn.dataset.copyUrl;
        if (!url) {
          alert('No link to copy. Shorten a URL first.');
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            const original = copyBtn.textContent;
            copyBtn.textContent = '✓ Copied!';
            setTimeout(() => { copyBtn.textContent = original; }, 1500);
          }).catch(() => {
            fallbackCopy(url);
          });
        } else {
          fallbackCopy(url);
        }
      }

      function fallbackCopy(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          const original = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied!';
          setTimeout(() => { copyBtn.textContent = original; }, 1500);
        } catch (e) {
          alert('Unable to copy. Please select and copy manually.');
        }
        document.body.removeChild(textArea);
      }

      function handleOpen() {
        const url = openBtn.dataset.openUrl;
        const long = openBtn.dataset.longUrl;
        if (url && long) {
          window.open(url, '_blank');
        } else {
          alert('No short link to open. Please shorten a URL first.');
        }
      }

      // ---------- init / load ----------
      function init() {
        // if there is a redirect, handle it first
        const redirected = handleRedirect();
        if (redirected) {
          // page will reload, no further action
          return;
        }

        // otherwise show UI with default state
        // add some demo links for preview (optional, but adds premium feel)
        // but only if no links exist
        if (shortLinks.length === 0) {
          const demoLong = 'https://en.wikipedia.org/wiki/URL_shortening';
          const demoShort = createShortCode(demoLong + 'demo');
          shortLinks.push({ short: demoShort, long: demoLong });
          counter++;
          const demoLong2 = 'https://example.com/very-long-resource-page-with-parameters';
          const demoShort2 = createShortCode(demoLong2 + 'demo2');
          shortLinks.push({ short: demoShort2, long: demoLong2 });
          counter++;
          updateUI(demoShort, demoLong);
          // update long for open
          openBtn.dataset.longUrl = demoLong;
          // set input to demo
          longInput.value = demoLong;
        }

        // event listeners
        shortenBtn.addEventListener('click', handleShorten);
        copyBtn.addEventListener('click', handleCopy);
        openBtn.addEventListener('click', handleOpen);
        longInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleShorten();
          }
        });

        // initial history update
        updateHistory();
        // update count
        linkCountSpan.textContent = `🔹 ${shortLinks.length} links shortened`;
      }

      // run
      init();

      // if not redirected, ensure we keep state across pages (session)
      // store shortlinks in sessionStorage to persist across reloads? 
      // But for simplicity, we keep them in memory. but we can persist.
      // However, for a demo tool, memory is fine. 
      // We'll add a small persistence: save to sessionStorage on each shorten
      // and load on init
      function persistLinks() {
        try {
          sessionStorage.setItem('shortLinks', JSON.stringify(shortLinks));
          sessionStorage.setItem('counter', String(counter));
        } catch(e) {}
      }

      function loadPersisted() {
        try {
          const stored = sessionStorage.getItem('shortLinks');
          const storedCounter = sessionStorage.getItem('counter');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              shortLinks = parsed;
              counter = parseInt(storedCounter, 10) || shortLinks.length;
              // update UI
              if (shortLinks.length > 0) {
                const last = shortLinks[shortLinks.length - 1];
                updateUI(last.short, last.long);
                openBtn.dataset.longUrl = last.long;
                longInput.value = last.long;
              }
              updateHistory();
              linkCountSpan.textContent = `🔹 ${shortLinks.length} links shortened`;
              return true;
            }
          }
        } catch(e) {}
        return false;
      }

      // override init to load persisted
      const originalInit = init;
      init = function() {
        // first check redirect
        const params = new URLSearchParams(window.location.search);
        const shortCode = params.get('s');
        if (shortCode) {
          // try to find in memory
          const found = shortLinks.find(item => item.short === shortCode);
          if (found) {
            window.location.replace(found.long);
            return;
          }
          // if not found, maybe load from session
          loadPersisted();
          const foundAgain = shortLinks.find(item => item.short === shortCode);
          if (foundAgain) {
            window.location.replace(foundAgain.long);
            return;
          }
          // not found
          shortDisplay.innerHTML = `<span style="color:#b91c1c;">⚠️ Short link not found</span>`;
        } else {
          // load persisted
          const loaded = loadPersisted();
          if (!loaded) {
            // default demo
            const demoLong = 'https://en.wikipedia.org/wiki/URL_shortening';
            const demoShort = createShortCode(demoLong + 'demo');
            shortLinks.push({ short: demoShort, long: demoLong });
            counter++;
            const demoLong2 = 'https://example.com/very-long-resource-page-with-parameters';
            const demoShort2 = createShortCode(demoLong2 + 'demo2');
            shortLinks.push({ short: demoShort2, long: demoLong2 });
            counter++;
            updateUI(demoShort, demoLong);
            openBtn.dataset.longUrl = demoLong;
            longInput.value = demoLong;
            updateHistory();
            linkCountSpan.textContent = `🔹 ${shortLinks.length} links shortened`;
          }
        }
        // attach events
        shortenBtn.addEventListener('click', function() {
          handleShorten();
          persistLinks();
        });
        copyBtn.addEventListener('click', handleCopy);
        openBtn.addEventListener('click', handleOpen);
        longInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleShorten();
            persistLinks();
          }
        });
        // update persist on shorten
        const originalShorten = handleShorten;
        handleShorten = function() {
          const result = originalShorten();
          persistLinks();
          return result;
        };
        // override updateUI to persist
        const originalUI = updateUI;
        updateUI = function(shortCode, longUrl) {
          originalUI(shortCode, longUrl);
          persistLinks();
        };
      };

      // re-run init with persistence
      // but avoid double init: we'll just call the new init
      // clean any previous listeners
      // we'll just reinitialize
      // replace event listeners
      // simple: re-run
      // remove old listeners by cloning? we'll just attach new ones after reset
      // for simplicity we reload the logic
      // but we already have a init that handles everything
      // We'll call init again, but first remove previous listeners
      // we can use a flag
      if (window._initDone) {
        // remove all listeners
        const newShorten = shortenBtn.cloneNode(true);
        shortenBtn.parentNode.replaceChild(newShorten, shortenBtn);
        // reassign
        // but easier: just reload page? no.
        // we'll just use the new init with a flag
        window.location.reload(); 
      } else {
        window._initDone = true;
        // but we already have init called above. We'll override.
        // just call the new init after clearing.
        // We'll just use the new init
        // but we need to reset the DOM
        // best: reload page for simplicity
        // but we want persistence, so we just call load
        // clean approach: just call init again with override
        // but to avoid duplication we'll use a flag.
        // We'll just keep the original and add persistence.
        // final: just use the init with persistence.
        // we'll call it once.
        // remove the old init
        // We'll just use the new init function defined above.
        // but we need to call it
        // we'll call it now.
        // but we already called init() earlier. so we need to override.
        // we'll just set a new init and call it.
        window.init = init;
        init();
      }
    })();
  </script>
</body>
</html>
